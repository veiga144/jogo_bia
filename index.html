<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planeta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ========== ECRÃ: PERFIS ========== -->
  <div id="ecra-perfis" class="ecra ativo">
    <div class="logo-titulo">
      <div class="planeta-logo">🌍</div>
      <h1>Planeta</h1>
      <p class="subtitulo">Aprende o mundo a brincar!</p>
    </div>
    <div id="lista-perfis" class="lista-perfis"></div>
    <button class="btn btn-principal" id="btn-novo-perfil">+ Criar novo jogador</button>
  </div>

  <!-- ========== ECRÃ: CRIADOR DE PERSONAGEM ========== -->
  <div id="ecra-criador" class="ecra">
    <div class="cabecalho-ecra">
      <h2>Escolhe o teu animal!</h2>
    </div>
    <div class="criador-layout">
      <div class="criador-preview-animal">
        <div class="criador-preview-img-wrap">
          <img id="criador-preview-img" src="" alt="" style="display:none">
          <div id="criador-preview-emoji" class="criador-preview-emoji">🐾</div>
        </div>
        <div class="criador-preview-info">
          <span id="criador-preview-nome" class="criador-nome-animal">Escolhe um animal!</span>
          <span id="criador-preview-onde" class="criador-onde-animal"></span>
        </div>
      </div>
      <div class="animais-grid" id="animais-grid"></div>
      <div class="criador-dados">
        <div class="dummy-svg-placeholder" style="display:none">
        <svg id="avatar-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
          <!-- Corpo -->
          <rect id="av-corpo" x="60" y="160" width="80" height="100" rx="15" fill="#4A90D9"/>
          <!-- Pescoço -->
          <rect id="av-pescoco" x="88" y="148" width="24" height="20" fill="#FDBCB4"/>
          <!-- Cabeça -->
          <circle id="av-cabeca" cx="100" cy="120" r="50" fill="#FDBCB4"/>
          <!-- Olhos -->
          <circle id="av-olho-esq" cx="82" cy="115" r="8" fill="white"/>
          <circle id="av-olho-dir" cx="118" cy="115" r="8" fill="white"/>
          <circle id="av-iris-esq" cx="84" cy="116" r="5" fill="#5C4033"/>
          <circle id="av-iris-dir" cx="120" cy="116" r="5" fill="#5C4033"/>
          <circle cx="85" cy="115" r="2" fill="black"/>
          <circle cx="121" cy="115" r="2" fill="black"/>
          <circle cx="87" cy="113" r="1.5" fill="white"/>
          <circle cx="123" cy="113" r="1.5" fill="white"/>
          <!-- Nariz -->
          <ellipse id="av-nariz" cx="100" cy="128" rx="4" ry="3" fill="rgba(0,0,0,0.1)"/>
          <!-- Boca -->
          <path id="av-boca" d="M 88 138 Q 100 148 112 138" stroke="#c0706a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Cabelo (sobrepõe a cabeça) -->
          <g id="av-cabelo">
            <path d="M 52 110 Q 50 70 100 62 Q 150 70 148 110 Q 140 80 100 75 Q 60 80 52 110 Z" fill="#5C3317"/>
            <path d="M 52 110 Q 48 120 50 130 Q 55 100 60 110 Z" fill="#5C3317"/>
            <path d="M 148 110 Q 152 120 150 130 Q 145 100 140 110 Z" fill="#5C3317"/>
          </g>
          <!-- Braços -->
          <rect id="av-braco-esq" x="30" y="165" width="32" height="18" rx="9" fill="#4A90D9"/>
          <rect id="av-braco-dir" x="138" y="165" width="32" height="18" rx="9" fill="#4A90D9"/>
          <!-- Mãos -->
          <circle cx="30" cy="174" r="11" fill="#FDBCB4"/>
          <circle cx="170" cy="174" r="11" fill="#FDBCB4"/>
        </svg>
        </div><!-- fim dummy-svg-placeholder -->
        <div class="campo-grupo">
          <label>O teu nome</label>
          <input type="text" id="input-nickname" placeholder="Como te chamas?" maxlength="16">
        </div>
        <div class="campo-grupo">
          <label>Idade</label>
          <input type="number" id="input-idade" min="5" max="15" value="8">
        </div>
      </div><!-- fim criador-dados -->
      <button class="btn btn-principal" id="btn-confirmar-criador">Pronto! Vamos explorar! 🚀</button>
    </div>
  </div>

  <!-- ========== ECRÃ: BOAS-VINDAS ========== -->
  <div id="ecra-boas-vindas" class="ecra">
    <div class="boas-vindas-conteudo">
      <div class="mascote-grande">
        <img src="imagens/BIA_sem_fundo.png" alt="Beatriz"
             style="width:180px;object-fit:contain;object-position:top;
                    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.4));
                    animation:bounce-in 0.6s ease-out">
      </div>
      <div class="balao-fala">
        <p id="texto-boas-vindas"></p>
      </div>
      <button class="btn btn-principal" id="btn-comecar">Vamos explorar! 🌍</button>
    </div>
  </div>

  <!-- ========== ECRÃ: MAPA ========== -->
  <div id="ecra-mapa" class="ecra">
    <div class="hud">
      <div class="hud-avatar" id="hud-avatar-btn">
        <div id="hud-avatar-wrap" style="width:44px;height:44px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px">🐾</div>
      </div>
      <div class="hud-moedas">🪙 <span id="hud-moedas">0</span></div>
      <button class="hud-btn" id="btn-som">🔊</button>
      <button class="hud-btn" id="btn-guarda-roupa">👗</button>
    </div>
    <div class="mapa-container">
      <img src="imagens/mapa do mundo.avif" class="mapa-img" alt="Mapa Mundo">
      <div class="mapa-vinheta"></div>
      <div id="pinos-container"></div>
    </div>
    <div class="mapa-titulo">
      <h2>🌍 Planeta</h2>
      <p>Escolhe um mundo para explorar!</p>
    </div>
  </div>

  <!-- ========== ECRÃ: QUIZ ========== -->
  <div id="ecra-quiz" class="ecra">
    <div class="quiz-topo">
      <div class="quiz-progresso">
        <span id="quiz-mundo-nome"></span>
        <div class="barra-progresso"><div id="barra-fill" class="barra-fill"></div></div>
        <span id="quiz-progresso-texto"></span>
      </div>
      <div class="quiz-moedas">🪙 <span id="quiz-moedas">0</span></div>
    </div>

    <div class="quiz-corpo">
      <div class="quiz-mascote-pequena" id="quiz-beatriz"></div>
      <p id="quiz-pergunta" class="quiz-pergunta-texto"></p>

      <div id="quiz-opcoes" class="quiz-opcoes"></div>

      <div id="painel-dicas" class="painel-dicas oculto">
        <div class="balao-beatriz">
          <p id="texto-dica"></p>
        </div>
        <button class="btn btn-dica" id="btn-dica">💡 Pedir ajuda à Beatriz</button>
      </div>
    </div>
  </div>

  <!-- ========== ECRÃ: RESULTADO DA RESPOSTA ========== -->
  <div id="ecra-resultado" class="ecra">
    <div class="resultado-conteudo">
      <div id="resultado-icone" class="resultado-icone"></div>
      <h2 id="resultado-titulo"></h2>
      <p id="resultado-moedas-ganhas" class="moedas-ganhas"></p>
      <div class="curiosidade-box">
        <span class="curiosidade-label">💡 Sabias que…</span>
        <p id="resultado-curiosidade"></p>
      </div>
      <button class="btn btn-principal" id="btn-continuar-resultado">Continuar →</button>
    </div>
  </div>

  <!-- ========== ECRÃ: MINI-JOGO ========== -->
  <div id="ecra-minijogo" class="ecra">
    <div class="minijogo-topo">
      <h2 id="minijogo-titulo"></h2>
      <p id="minijogo-instrucao"></p>
    </div>
    <div id="minijogo-area" class="minijogo-area"></div>
    <div class="minijogo-rodape">
      <div id="minijogo-estado"></div>
    </div>
  </div>

  <!-- ========== ECRÃ: CONCLUSÃO DO MUNDO ========== -->
  <div id="ecra-conclusao" class="ecra">
    <div class="conclusao-conteudo">
      <div class="conclusao-medalha" id="conclusao-medalha"></div>
      <h1 id="conclusao-titulo">Mundo Completo!</h1>
      <p id="conclusao-subtitulo"></p>
      <div class="conclusao-recompensas">
        <div class="recompensa-item">🪙 <span id="conclusao-moedas"></span> moedas ganhas!</div>
        <div class="recompensa-item" id="conclusao-medalha-texto"></div>
      </div>
      <button class="btn btn-principal" id="btn-voltar-mapa">Voltar ao mapa 🌍</button>
    </div>
  </div>

  <!-- ========== ECRÃ: GUARDA-ROUPA ========== -->
  <div id="ecra-guarda-roupa" class="ecra">
    <div class="cabecalho-ecra">
      <button class="btn-voltar" id="btn-fechar-guarda-roupa">← Voltar</button>
      <h2>Guarda-roupa 👗</h2>
    </div>
    <div class="guarda-roupa-layout">
      <div class="gr-avatar">
        <div id="gr-avatar-div" class="gr-avatar-animal"></div>
        <div class="gr-moedas">🪙 <span id="gr-moedas">0</span></div>
      </div>
      <div class="gr-loja" id="gr-loja"></div>
    </div>
  </div>

</div><!-- #app -->

<script src="js/game.js"></script>
<script src="js/avatar.js"></script>
<script src="js/quiz.js"></script>
<script src="js/minigames.js"></script>
</body>
</html>
